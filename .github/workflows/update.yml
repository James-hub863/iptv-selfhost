name: update

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 初始化 Git 环境与认证
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch origin main

      - name: 安装依赖
        run: |
          sudo apt-get install -y -qq git-lfs
          git lfs install
          pip install requests

      - name: 收集原始源
        run: |
          echo "🔍 开始收集原始源..."
          python collect.py
          echo "✅ 收集完成"

      - name: 测活与分组重写
        run: |
          echo "🏥 开始测活..."
          python check.py
          echo "✅ 测活完成"
          echo "📋 开始分组重写..."
          python group_m3u.py
          echo "✅ 分组重写完成"

      - name: 生成全量聚合清单
        run: |
          if [ -f "m3u.py" ]; then
            python m3u.py
          else
            echo "⚠️ m3u.py 不存在，跳过生成全量清单"
          fi

      - name: 提交 GitHub 结果（含缓存，自动变基防冲突）
        run: |
          git fetch origin main
          
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          
          git commit -m "chore: 自动收集测活 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          
          if ! git pull --rebase origin main; then
            echo "⚠️ 检测到合并冲突，正在强制使用本地测活结果覆盖..."
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            for file in $CONFLICTS; do
              git checkout --ours -- "$file"
              git add "$file"
            done
            git rebase --continue
          fi
          
          git push origin main

      - name: 上传测活报告与死链清单（保留 7 天）
        uses: actions/upload-artifact@v4
        with:
          name: iptv-report-${{ github.run_number }}
          path: |
            report.json
            dead_urls.txt
            live_ok.m3u
          retention-days: 7
