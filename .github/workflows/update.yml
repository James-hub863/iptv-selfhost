name: update

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write  # 必须：允许 Action 写入仓库（解决 403）

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（完整仓库，含历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 初始化 Git 环境与认证（统一修复 403）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.com"
          git config --global http.postBuffer 524288000
          # 关键：将远程地址替换为带 Token 的地址，后续 git push 无需再设
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

      - name: 安装依赖
        run: sudo apt-get install -y -qq git-lfs

      - name: 并发收集与测活
        run: |
          python collect.py
          python check.py

      - name: 生成全量聚合清单
        run: python -c "import m3u; m3u.generate_all()" || echo "生成全量清单"

     - name: 提交 GitHub 结果（含缓存，自动变基防冲突）
  run: |
    git fetch origin main
    # 暂存所有变更（包括未跟踪文件）
    git add -A
    # 检查是否有实际变更需提交
    if git diff --cached --quiet; then
      echo "无变更，跳过提交"
      exit 0
    fi
    # 提交本地变更
    git commit -m "chore: 自动收集测活 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
    # 此时工作区已干净，可安全 rebase
    git pull --rebase origin main
    git push origin main

      - name: 上传测活报告与死链清单（保留 7 天）
        uses: actions/upload-artifact@v7
        with:
          name: iptv-report-${{ github.run_number }}
          path: |
            report.json
            dead_urls.txt
          retention-days: 7

      # ===== 更新 README =====
      - name: 更新 README 首页直连地址
        env:
          GITEE_USER: "James-hub863"
          GITEE_REPO: "iptv-selfhost"
        run: python scripts/update_readme.py

      - name: 提交更新后的 README
        run: |
          git fetch origin main
          git add README.md
          if git diff --cached --quiet; then
            echo "README 无变更，跳过"
            exit 0
          fi
          git commit -m "docs: 更新 README 订阅地址 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push origin main

      # ===== 同步到 Gitee（国内直连） =====
      - name: 确保 Gitee 仓库存在（不存在则创建私有仓）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: "iptv-selfhost"
        run: |
          curl -X POST "https://gitee.com/api/v5/user/repos" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "access_token=$GITEE_TOKEN&name=$GITEE_REPO&private=true" || true

      - name: 推送清单到 Gitee（强制更新）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: "James-hub863"
          GITEE_REPO: "iptv-selfhost"
        run: |
          cd /tmp
          rm -rf gitee-mirror
          git clone "https://oauth2:$GITEE_TOKEN@gitee.com/$GITEE_USER/$GITEE_REPO.git" gitee-mirror || true
          
          cd gitee-mirror
          cp $GITHUB_WORKSPACE/live_ok.m3u .
          cp $GITHUB_WORKSPACE/live_all.m3u .
          git add .
          git commit -m "sync: $(date '+%Y-%m-%d %H:%M')" || echo "无变更"
          git push --force "https://oauth2:$GITEE_TOKEN@gitee.com/$GITEE_USER/$GITEE_REPO.git" HEAD:master

      - name: 输出国内直连地址
        env:
          GITEE_USER: "James-hub863"
          GITEE_REPO: "iptv-selfhost"
        run: |
          echo "✅ 同步完成！APTV 请使用以下国内直连地址（极速无超时）："
          echo "https://gitee.com/$GITEE_USER/$GITEE_REPO/raw/master/live_ok.m3u"
          echo "（全量版）：https://gitee.com/$GITEE_USER/$GITEE_REPO/raw/master/live_all.m3u"
