name: 收集并测活 IPTV 直播源

on:
  schedule:
    # 每 8 小时一次：UTC 00:00 / 08:00 / 16:00（北京时间 08:00 / 16:00 / 24:00）
    - cron: '0 */8 * * *'
  workflow_dispatch:      # 允许在 Actions 页面手动触发
  push:
    branches: [main]
    paths:
      - 'sources.txt'
      - '.github/workflows/update.yml'

# 允许本 workflow 向仓库写入（commit + push）
permissions:
  contents: write

env:
  TZ: Asia/Shanghai          # 日志时间显示北京时间
  PYTHONUNBUFFERED: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90       # 大列表测活可能耗时，给足余量
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6   # 2026-09-23 后必须 v5+，Node 20 已移除

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # requests 用于稳定并发测活；ffmpeg 可选，供后续分辨率探测扩展
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install requests

      - name: 初始化缓存（首次运行）
        run: |
          if [ ! -f cache.json ]; then
            echo '{}' > cache.json
            echo "已创建初始 cache.json"
          fi

      - name: 收集多源 M3U
        timeout-minutes: 30   # 单步最多 30 分钟
        continue-on-error: true  # 收集部分失败不影响后续
        run: python collect.py

      - name: 并发测活并择优
        timeout-minutes: 45   # 单步最多 45 分钟
        run: python check.py

      - name: 生成全量聚合清单（不去重，便于审计）
        run: |
          python - <<'PY'
          import json
          with open('raw_channels.json', encoding='utf-8') as f:
              items = json.load(f)
          seen = set()
          lines = ['#EXTM3U']
          for it in items:
              if it['url'] in seen: continue
              seen.add(it['url'])
              logo = it.get('logo') or ''
              logo_attr = f' tvg-logo="{logo}"' if logo else ''
              lines.append(
                  f'#EXTINF:-1 tvg-name="{it.get("name","")}"{logo_attr} '
                  f'group-title="{it.get("group","其他")}",{it.get("name","")}'
              )
              lines.append(it['url'])
          with open('live_all.m3u', 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          print('全量清单', len(seen), '条')
          PY

      - name: 提交结果（含缓存，自动变基防冲突）
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.com"
          
          # 确保拉取完整历史（避免浅克隆导致 rebase 失败）
          git fetch origin main --unshallow || git fetch origin main
          
          git add -A
          git add -f cache.json  # 强制跟踪缓存文件，确保跨次生效
          
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          
          git commit -m "chore: 自动收集测活 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          
          # 先拉取远程变更并变基，解决非快进拒绝（rejected）问题
          git pull --rebase origin main
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传测活报告与死链清单（保留 7 天）
        uses: actions/upload-artifact@v7   # 2026-09-23 后必须 v5+
        with:
          name: iptv-report-${{ github.run_number }}
          path: |
            report.json
            dead_urls.txt
          retention-days: 7
